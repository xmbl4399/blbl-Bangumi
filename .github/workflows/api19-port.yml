name: API19 Port
on:
  workflow_dispatch:
    inputs:
      mode: {description: "merge | build", required: true, default: "merge"}
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: api19-port, fetch-depth: 0, token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-java@v4
        if: ${{ inputs.mode == 'build' }}
        with: {distribution: temurin, java-version: "17", cache: gradle}
      - name: Merge
        if: ${{ inputs.mode == 'merge' }}
        run: |
          set -uo pipefail
          git config user.email ci@local; git config user.name ci
          git fetch origin main
          rm -f .github/workflows/api19-port.yml.bak
          git reset --hard origin/main 2>/dev/null || true
          # start from api19 tip again
          git checkout -B api19-port "${{ github.event.inputs.base || 'e8013a410be569a8423a0d53d032eff7a20bf17c' }}" 2>/dev/null || git checkout -B api19-port e8013a410be569a8423a0d53d032eff7a20bf17c
          BASE=$(git merge-base HEAD origin/main)
          OURS=$(git rev-parse HEAD)
          git merge --no-commit --no-ff origin/main || true
          for f in $(git diff --name-only --diff-filter=U); do git checkout --ours -- "$f"; git add -- "$f"; done
          git diff --name-only "$BASE" "$OURS" > /tmp/ours.list
          git diff --name-only "$BASE" origin/main > /tmp/theirs.list
          comm -12 <(sort /tmp/ours.list) <(sort /tmp/theirs.list) > /tmp/both.list
          echo "SHARED=$(wc -l < /tmp/both.list)"
          while read -r f; do
            [ -z "$f" ] && continue
            git cat-file -e "$OURS:$f" 2>/dev/null || continue
            git cat-file -e "origin/main:$f" 2>/dev/null || continue
            git cat-file -e "$BASE:$f" 2>/dev/null || continue
            git show "$BASE:$f" > /tmp/base.f; git show "$OURS:$f" > /tmp/ours.f; git show "origin/main:$f" > /tmp/theirs.f
            if git merge-file -p /tmp/ours.f /tmp/base.f /tmp/theirs.f > /tmp/m.f 2>/dev/null; then
              if ! cmp -s /tmp/m.f /tmp/ours.f; then echo "3WAY_OK $f"; cp /tmp/m.f "$f"; fi
            else
              echo "CONFLICT_KEEP_OURS $f"
            fi
          done < /tmp/both.list
          git checkout origin/main -- app/src/main/res/layout/item_bangumi_follow.xml
          grep -n "toHttpUrlOrNull" app/src/main/java/blbl/cat3399/core/image/ImageLoader.kt && echo "!! ImageLoader overwritten" || echo "ImageLoader=api19 OK"
          git add -A
          git commit -m "merge: main into api19 (3-way on shared files)" || echo nothing
          git push -f origin HEAD:api19-port
          echo "HEAD_AFTER=$(git rev-parse HEAD)"
      - name: Build
        if: ${{ inputs.mode == 'build' }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          chmod +x ./gradlew; mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
          set +e
          ./gradlew :app:assembleKitkatRelease -PversionName=0.1.32 -PversionCode=${{ github.run_number }} > /tmp/b.log 2>&1
          echo "RC=$?"
          grep -nE "^e: |error:|Unresolved reference|Cannot access" /tmp/b.log | head -60
          tail -20 /tmp/b.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: log, path: /tmp/b.log}
      - uses: actions/upload-artifact@v4
        if: success()
        with: {name: apk, path: app/build/outputs/apk/kitkat/release/*.apk}
